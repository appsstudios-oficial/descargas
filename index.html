<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga de Lista M3U</title>
    <style>
        /* Estilos alineados con la estética oscura y roja del blog */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: block;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            padding: 30px;
            background-color: #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-top: 4px solid #cc0000;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 25px;
        }

        /* Estilos de los botones */
        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
        }

        /* Botón de carga (Deshabilitado) */
        #btn-countdown {
            background-color: #2a2a2a;
            color: #888888;
            cursor: not-allowed;
            border: 1px solid #3a3a3a;
        }

        /* Botón de destino (Rojo brillante al activarse) */
        #btn-link {
            display: none; /* Oculto al principio */
            background-color: #cc0000;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(204, 0, 0, 0.3);
        }

        #btn-link:hover {
            background-color: #ff0000;
            box-shadow: 0 4px 15px rgba(204, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Obteniendo recurso seguro</h2>
        <p>Por favor, aguarde un instante mientras se procesa el enlace...</p>
        
        <button id="btn-countdown" class="btn">Espere <span id="countdown">5</span> segundos...</button>
        
        <a id="btn-link" href="https://archivosm3uindex.blogspot.com/2026/05/nueva-lista.html" target="_blank" class="btn">Nueva Lista Mayo</a>
    </div>

    <script>
        // Lógica de la cuenta regresiva
        let seconds = 5;
        const countdownSpan = document.getElementById('countdown');
        const btnCountdown = document.getElementById('btn-countdown');
        const btnLink = document.getElementById('btn-link');

        const interval = setInterval(() => {
            seconds--;
            countdownSpan.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(interval);
                // Ocultar botón de espera y mostrar el botón de destino
                btnCountdown.style.display = 'none';
                btnLink.style.display = 'inline-block';
            }
        }, 1000);
    </script>

</body>
</html>
